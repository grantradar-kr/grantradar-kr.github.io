name: Update policy data (매일 06:00 / 18:00 KST)

on:
  schedule:
    # UTC 기준. 21:00 UTC = 06:00 KST, 09:00 UTC = 18:00 KST
    - cron: '0 21 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '캐시 무시하고 새로 수집'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write   # 갱신 후 Pages 배포 워크플로우를 트리거하기 위해 필요

concurrency:
  group: policy-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect policies (온통청년 · 복지로 · 기업마당 · K-Startup · 보조금24)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          python3 pipeline/collect_policies.py || {
            echo "::warning::수집 중 오류가 발생했습니다. 기존 데이터를 유지합니다.";
            exit 0;
          }

      - name: Show result summary
        run: |
          python3 - <<'PY'
          import json, pathlib
          meta = json.loads(pathlib.Path('public/data/meta.json').read_text(encoding='utf-8'))
          print(f"총 {meta['total']:,}건 · 소스별 {meta['by_source']}")
          print(f"마감임박 {meta['counts']['urgent7']:,}건 · 상시 {meta['counts']['always']:,}건")
          print(f"파일 크기 {pathlib.Path('public/data/policies.json').stat().st_size/1048576:.2f} MB")
          PY

      - name: Commit & push (변경분만)
        run: |
          git config user.name "grantradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/policies.json public/data/meta.json
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "data: 보조금 레이더 정책 데이터 자동 갱신 ($(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST'))"

          # 수집에 12~20분 걸리는 사이 원격 main 이 앞서 있을 수 있으므로,
          # 커밋 후 푸시 직전에 원격 변경분을 반영한다 (non-fast-forward / fetch first 방지).
          # 충돌할 때는 방금 수집한 public/data/* 가 최신이므로 merge 에서 현재 커밋(-X ours)을 우선하고,
          # UI 등 나머지 변경은 그대로 합쳐진다.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::warning::rebase 충돌 — 방금 수집한 데이터를 우선해 merge 로 복구합니다."
              git rebase --abort || true
              git merge --no-edit -X ours origin/main
            fi
            if git push origin HEAD:main; then
              echo "푸시 성공 (시도 ${attempt}회)"
              break
            fi
            if [ "${attempt}" = "3" ]; then
              echo "::error::3회 재시도 후에도 푸시에 실패했습니다."
              exit 1
            fi
            echo "::warning::푸시 실패 (시도 ${attempt}회) — 원격 변경분을 다시 반영하고 재시도합니다."
            sleep 10
          done

      # GITHUB_TOKEN 으로 만든 push 는 다른 워크플로우를 트리거하지 않으므로,
      # 배포 워크플로우(deploy-pages.yml)를 명시적으로 호출해 사이트에 반영한다.
      - name: Trigger Pages deploy (갱신 데이터를 라이브 사이트에 반영)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
